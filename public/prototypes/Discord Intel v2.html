<!doctype html>
<html><head><meta charset="utf-8"/><title>Discord Intel v2</title>
<style>
  :root {
    --tv-bg:#0a0a0a; --tv-surface:#111; --tv-elevated:#1a1a1a; --tv-sidebar:#060606;
    --tv-text:#D1D4DC; --tv-heading:#fff; --tv-secondary:#787B86; --tv-muted:#434651;
    --tv-bull:#26A69A; --tv-bear:#EF5350; --tv-blue:#2962FF; --tv-orange:#FF9800;
    --tv-gold:#FFD700; --tv-silver:#D0D5DE; --tv-oil:#C9843F;
    --border:rgba(255,255,255,0.06); --border-d:rgba(255,255,255,0.08); --border-h:rgba(255,255,255,0.12);
    --divider:rgba(255,255,255,0.05);
  }
  html,body{margin:0;height:100%;background:var(--tv-bg);
    background-image:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(20,25,40,.35) 0%, transparent 70%);
    color:var(--tv-text);
    font-family:-apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;
    font-feature-settings:"tnum";}
  *{scrollbar-width:thin;scrollbar-color:var(--border-d) transparent;box-sizing:border-box}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border-d);border-radius:3px}
  @keyframes ping{75%,100%{transform:scale(2);opacity:0}}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes modal-in{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:none}}
  @keyframes backdrop-in{from{opacity:0}to{opacity:1}}
  .fade{animation:fade .2s ease both}
  .tnum{font-variant-numeric:tabular-nums}
  .hair{height:1px;width:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
  .card{background:var(--tv-surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;
    transition:border-color .2s, background .2s, transform .2s, box-shadow .2s}
  .card.clickable,.card.hoverable{cursor:pointer}
  .card.clickable:hover,.card.hoverable:hover{border-color:var(--border-h);background:#151515;transform:translateY(-1px);
    box-shadow:0 0 30px -10px rgba(255,255,255,.08)}
  .chip{display:inline-flex;align-items:center;padding:3px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.3px}
  .pulse{position:relative;display:inline-flex;width:8px;height:8px}
  .pulse::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--tv-bull);opacity:.5;animation:ping 1.5s cubic-bezier(0,0,.2,1) infinite}
  .pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--tv-bull)}
  .nav-item{position:relative;height:44px;display:flex;align-items:center;justify-content:center;
    margin:3px 8px;border-radius:8px;color:#787B86;cursor:pointer;transition:all .15s}
  .nav-item:hover{color:#D1D4DC;background:rgba(255,255,255,.03)}
  .nav-item.active{color:#2962FF;background:rgba(41,98,255,.08)}
  .nav-item.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:0 3px 3px 0;background:#2962FF;box-shadow:0 0 8px rgba(41,98,255,.6)}
  .nav-item svg{width:17px;height:17px;transition:filter .15s}
  .nav-item.active svg{filter:drop-shadow(0 0 6px rgba(41,98,255,.55))}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);
    z-index:9998;animation:backdrop-in .25s ease both;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{position:relative;z-index:9999;width:95vw;max-width:720px;max-height:90vh;overflow-y:auto;
    background:var(--tv-surface);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 20px 70px rgba(0,0,0,.6);animation:modal-in .35s cubic-bezier(.16,1,.3,1) both}
  .close-btn{display:flex;width:28px;height:28px;align-items:center;justify-content:center;
    border-radius:6px;color:var(--tv-muted);cursor:pointer;transition:all .15s;background:transparent;border:none;font-size:14px}
  .close-btn:hover{background:rgba(255,255,255,.06);color:var(--tv-text)}
  .asset-pill{display:inline-flex;align-items:center;padding:6px 14px;border-radius:6px;font-size:11px;
    font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .15s;
    background:rgba(255,255,255,.03);color:rgba(255,255,255,.4);border:1px solid transparent}
  .asset-pill:hover{color:rgba(255,255,255,.75)}
  .asset-pill.active{background:rgba(41,98,255,.12);color:#2962FF;border-color:rgba(41,98,255,.25);
    box-shadow:0 0 16px -4px rgba(41,98,255,.35)}
  .row-click{cursor:pointer;transition:background .15s}
  .row-click:hover{background:rgba(255,255,255,.025)}
  .msg-card{background:var(--tv-surface);border:1px solid var(--border);border-radius:10px;padding:14px 18px;
    cursor:pointer;transition:all .18s;position:relative}
  .msg-card:hover{border-color:var(--border-h);background:#141414;transform:translateY(-1px)}
  .msg-card .accent{position:absolute;left:0;top:12px;bottom:12px;width:2px;border-radius:0 2px 2px 0;opacity:.65}
  .tag{display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700;letter-spacing:.4px}
  .search-input{width:100%;background:transparent;border:none;outline:none;color:#fff;font-size:13px;padding:0;
    font-family:inherit}
  .search-input::placeholder{color:var(--tv-muted)}
  .filter-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:transparent;
    color:var(--tv-secondary);border:1px solid var(--border);border-radius:6px;font-size:11px;font-weight:500;
    cursor:pointer;transition:all .15s;font-family:inherit}
  .filter-btn:hover{color:#fff;border-color:var(--border-h);background:rgba(255,255,255,.02)}
  .filter-btn.active{color:#2962FF;border-color:rgba(41,98,255,.3);background:rgba(41,98,255,.08)}
  /* tradingview-style bull/bear glow treatments */
  .bull-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.6px;
    color:#26A69A;background:linear-gradient(180deg,rgba(38,166,154,.18),rgba(38,166,154,.08));
    border:1px solid rgba(38,166,154,.25);box-shadow:inset 0 1px 0 rgba(38,166,154,.15),0 0 12px -2px rgba(38,166,154,.35)}
  .bear-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.6px;
    color:#EF5350;background:linear-gradient(180deg,rgba(239,83,80,.18),rgba(239,83,80,.08));
    border:1px solid rgba(239,83,80,.25);box-shadow:inset 0 1px 0 rgba(239,83,80,.15),0 0 12px -2px rgba(239,83,80,.35)}
  .neutral-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:5px;font-size:11px;font-weight:700;letter-spacing:.6px;
    color:rgba(255,255,255,.55);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  .split-bar{position:relative;display:flex;height:4px;border-radius:2px;overflow:hidden;background:rgba(255,255,255,.04)}
  .split-bar .bull{background:linear-gradient(90deg,rgba(38,166,154,.5),#26A69A);box-shadow:0 0 8px rgba(38,166,154,.4)}
  .split-bar .bear{background:linear-gradient(90deg,#EF5350,rgba(239,83,80,.5));box-shadow:0 0 8px rgba(239,83,80,.4)}
  .tnum-bull{color:#26A69A;text-shadow:0 0 12px rgba(38,166,154,.4)}
  .tnum-bear{color:#EF5350;text-shadow:0 0 12px rgba(239,83,80,.4)}
  .hero-card{position:relative;background:var(--tv-surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;cursor:pointer;transition:all .2s;overflow:hidden}
  .hero-card:hover{border-color:var(--border-h);transform:translateY(-1px)}
  .hero-card .glow{position:absolute;inset:0;opacity:.5;pointer-events:none;transition:opacity .25s}
  .hero-card:hover .glow{opacity:.9}
  .briefing-card{position:relative;background:var(--tv-surface);border:1px solid var(--border);border-radius:12px;padding:18px 20px;cursor:pointer;transition:all .2s;overflow:hidden}
  .briefing-card:hover{border-color:var(--border-h);transform:translateY(-1px)}
  .briefing-card .glow{position:absolute;inset:0;opacity:.6;pointer-events:none;transition:opacity .25s}
  .briefing-card:hover .glow{opacity:1}
</style>
</head><body>
<div style="display:flex;height:100vh">
  <!-- sidebar -->
  <aside style="width:56px;background:var(--tv-sidebar);border-right:1px solid var(--border-d);
    background-image:linear-gradient(180deg,rgba(20,25,40,.15),transparent 40%);display:flex;flex-direction:column">
    <div style="height:56px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border-d)">
      <div style="width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#2962FF,rgba(41,98,255,.4));
        box-shadow:0 0 16px -2px rgba(41,98,255,.55);display:flex;align-items:center;justify-content:center;
        font-size:11px;font-weight:800;color:#fff;letter-spacing:-.3px">TT</div>
    </div>
    <nav style="flex:1;padding:6px 0" id="nav"></nav>
    <div style="padding:14px;display:flex;justify-content:center;border-top:1px solid var(--border-d)">
      <span class="pulse"></span>
    </div>
  </aside>

  <!-- main -->
  <main style="flex:1;overflow-y:auto;padding:20px 24px">
    <!-- Header -->
    <div class="fade" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:12px">
        <h1 style="margin:0;font-size:15px;font-weight:600;letter-spacing:.3px;color:#fff">
          Discord Intel
        </h1>
        <span class="pulse"></span>
        <span style="font-size:11px;color:var(--tv-secondary)">ingesting from 4 channels · live</span>
      </div>
      <div style="display:flex;gap:4px" id="asset-filter"></div>
    </div>

    <!-- 4 stat cards -->
    <div class="fade" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px" id="stats"></div>

    <!-- Daily Briefing hero -->
    <div class="fade" style="margin-bottom:20px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding:0 2px">
        <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:rgba(255,255,255,.55)">
          Daily Briefing
        </h2>
        <span style="font-size:10px;color:var(--tv-secondary)" id="briefing-sub"></span>
      </div>
      <div id="briefing"></div>
    </div>

    <!-- Two summary cards: Most Active + Strongest Signals -->
    <div class="fade" style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px" id="summary-cards"></div>

    <!-- Latest message card -->
    <div class="fade" style="margin-bottom:20px" id="latest-card"></div>

    <!-- Status -->
    <div class="fade card">
      <div class="hair"></div>
      <div style="display:flex;align-items:center;gap:12px;padding:12px 20px">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#26A69A;animation:ping 2s infinite"></span>
        <span style="font-size:13px;font-weight:500;color:rgba(255,255,255,.8)">Discord ingestion online</span>
        <span style="font-size:12px;color:rgba(255,255,255,.3)">last message 8s ago</span>
      </div>
    </div>
  </main>
</div>

<div id="modal-root"></div>

<script>
// ── ICONS ────────────────────────────────────────────────────────────

  stocks: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="3" height="6" rx=".5"/><rect x="8.5" y="7" width="3" height="10" rx=".5"/><rect x="14" y="3.5" width="3" height="13.5" rx=".5"/></svg>`,
  trades: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11l-3-3M17 13H6l3 3"/></svg>`,
  admin: `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.5l6 2v5c0 3.5-2.5 6.7-6 8-3.5-1.3-6-4.5-6-8v-5l6-2z"/></svg>`,
};
const navItems = [
  ['Market','market'],['Sentiment','sentiment'],['Scoring','scoring'],['Community','community'],
  ['Discord','discord'],['Data','data'],['Stocks','stocks'],['Trades','trades'],['Admin','admin']
];
document.getElementById('nav').innerHTML = navItems.map(([n,k]) =>
  `<div class="nav-item ${n==='Discord'?'active':''}" title="${n==='Discord'?'Discord Intel':n}">${I[k]}</div>`
).join('');

// ── ASSET FILTER ─────────────────────────────────────────────────────
const ASSETS = ['All','Gold','Silver','Oil'];
let currentAsset = 'All';
function renderAssetFilter(){
  document.getElementById('asset-filter').innerHTML = ASSETS.map(a =>
    `<div class="asset-pill ${a===currentAsset?'active':''}" data-asset="${a}">${a}</div>`
  ).join('');
  document.querySelectorAll('[data-asset]').forEach(n => {
    n.addEventListener('click', () => { currentAsset = n.dataset.asset; renderAll(); });
  });
}

// ── DATA ─────────────────────────────────────────────────────────────
const ASSET_META = {
  Gold:   {color:'#FFD700', key:'GOLD'},
  Silver: {color:'#D0D5DE', key:'SILVER'},
  Oil:    {color:'#C9843F', key:'OIL'},
};

const BRIEFING = {
  overall: {bias:'BULLISH', asset:'Oil'}, // community mostly bullish on Oil
  assets: [
    {asset:'Gold',   bias:'BULLISH', entries:1, exits:1, opinions:19, bullish:62, bearish:38, signals:21},
    {asset:'Silver', bias:'BEARISH', entries:1, exits:0, opinions:8,  bullish:34, bearish:66, signals:9},
    {asset:'Oil',    bias:'BULLISH', entries:3, exits:3, opinions:75, bullish:71, bearish:29, signals:81},
  ],
  totalSignals: 111,
};

const MOST_ACTIVE = [
  {user:'dbeers_',           count:18, asset:'Oil',    bias:'bull'},
  {user:'sonicthehedgehogxx',count:15, asset:'Oil',    bias:'bull'},
  {user:'pn3282',            count: 8, asset:'Oil',    bias:'bull'},
  {user:'foftylife',         count: 5, asset:'Oil',    bias:'bull'},
  {user:'cory032793',        count: 5, asset:'Oil',    bias:'bull'},
  {user:'kazzbrother',       count: 4, asset:'Oil',    bias:'bull'},
  {user:'boldicus',          count: 3, asset:'Silver', bias:'bull'},
];

const STRONGEST_SIGNALS = [
  {user:'kazzbrother', asset:'OIL',  type:'ENTRY', conf:94, time:'23:05',
   preview:'Refineries and nations better hurry and buy US crude...'},
  {user:'dbeers_',     asset:'GOLD', type:'OPINION', conf:88, time:'23:28',
   preview:'OBE quietly killing it. Small Canadian producer...'},
  {user:'boldicus',    asset:'SILVER',type:'ENTRY', conf:82, time:'22:49',
   preview:'Pretty sure China developed a silver battery...'},
  {user:'sonicthehedgehogxx', asset:'OIL', type:'OPINION', conf:76, time:'22:58',
   preview:'1kg silver per battery.'},
];

const MESSAGES = [
  {user:'dbeers_', channel:'gold-commodities', time:'23:28',
   text:'OBE quietly killing it. Small Canadian producer that is minimally hedged with a great CEO who is gonna be buying shares to drive the price up.',
   tags:['GOLD','OPINION'], sentiment:'bull', conf:88},
  {user:'kazzbrother', channel:'traders-lounge', time:'23:05',
   text:'Refineries and nations better hurry and buy US crude & oil products while they are still available and Trump still tooths his horn about so many tankers lining up in US to fill up… Drain baby drain…',
   tags:['OIL','OPINION'], sentiment:'bull', conf:94},
  {user:'sonicthehedgehogxx', channel:'traders-lounge', time:'22:58',
   text:'1kg silver per battery.',

   text:"What's next? My take is US will escalate by maintaining blockade, raising fresh economic sanctions (already done one today), boarding and confiscating Iran sanctioned fleets all over the world. The question is… will Iran dare to retaliate? What is the measured response?",

  {user:'boldicus', channel:'gold-commodities', time:'22:49',

   tags:['OIL','ENTRY','SILVER','OPINION'], sentiment:'bull', conf:82},
  {user:'stoneapes', channel:'traders-lounge', time:'22:33',

  {user:'pn3282', channel:'oil-chat', time:'22:20',
   text:'WTI holding above 62 is huge. Buyers stepping in every dip today.',

  {user:'foftylife', channel:'oil-chat', time:'22:08',
   text:'long WTI 62.80 sl 62.40 tp 63.50',

  {user:'dbeers_', channel:'gold-commodities', time:'21:40',

   tags:['GOLD','EXIT'], sentiment:'neutral', conf:91},

// ── HELPERS ──────────────────────────────────────────────────────────
const biasColor = (b) => b === 'BULLISH' || b === 'bull' ? '#26A69A' : b === 'BEARISH' || b === 'bear' ? '#EF5350' : '#787B86';
const biasArrow = (b) => b === 'BULLISH' || b === 'bull' ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" style="display:inline-block;vertical-align:middle;margin-right:2px"><path d="M6 2l5 7H1z"/></svg>' : b === 'BEARISH' || b === 'bear' ? '<svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor" style="display:inline-block;vertical-align:middle;margin-right:2px"><path d="M6 10L1 3h10z"/></svg>' : '<span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;vertical-align:middle;margin-right:4px"></span>';
const tagColor = (tag) => {
  if (tag === 'GOLD')    return {bg:'rgba(255,215,0,.12)',   fg:'#FFD700'};
  if (tag === 'SILVER')  return {bg:'rgba(208,213,222,.1)',  fg:'#D0D5DE'};
  if (tag === 'OIL')     return {bg:'rgba(201,132,63,.14)',  fg:'#C9843F'};
  if (tag === 'ENTRY')   return {bg:'rgba(38,166,154,.12)',  fg:'#26A69A'};
  if (tag === 'EXIT')    return {bg:'rgba(255,152,0,.12)',   fg:'#FF9800'};
  if (tag === 'OPINION') return {bg:'rgba(255,255,255,.04)', fg:'rgba(255,255,255,.45)'};
  if (tag === 'LONG')    return {bg:'rgba(38,166,154,.1)',   fg:'#26A69A'};
  if (tag === 'SHORT')   return {bg:'rgba(239,83,80,.1)',    fg:'#EF5350'};
  return {bg:'rgba(255,255,255,.04)', fg:'var(--tv-secondary)'};
};

// ── FILTER ───────────────────────────────────────────────────────────
const TAG_FILTERS = ['All','Entries','Exits','Opinions'];
let currentTagFilter = 'All';
function matchesFilters(m){
  if (currentAsset !== 'All') {
    if (!m.tags.includes(currentAsset.toUpperCase())) return false;
  }
  if (currentTagFilter === 'Entries' && !m.tags.includes('ENTRY')) return false;
  if (currentTagFilter === 'Exits' && !m.tags.includes('EXIT')) return false;
  if (currentTagFilter === 'Opinions' && !m.tags.includes('OPINION')) return false;
  const q = (document.getElementById('search')?.value || '').trim().toLowerCase();
  if (q && !m.text.toLowerCase().includes(q) && !m.user.toLowerCase().includes(q)) return false;
  return true;
}
function filteredMessages(){ return MESSAGES.filter(matchesFilters); }

// ── STAT CARDS ───────────────────────────────────────────────────────
function renderStats(){
  const totalMsgs = 18731;
  const processed = 18731;
  const signals = 3281;
  const todaySignals = BRIEFING.totalSignals;
  const biasIsBull = BRIEFING.overall.bias === 'BULLISH';
  const biasClass = biasIsBull ? 'tnum-bull' : 'tnum-bear';

      ${MOST_ACTIVE.map((a,i) => `
        <div style="display:flex;align-items:center;gap:12px;padding:11px 0;${i===MOST_ACTIVE.length-1?'':'border-bottom:1px solid var(--divider)'}">
          <span class="tnum" style="font-size:11px;color:var(--tv-muted);min-width:22px;font-weight:600">${String(i+1).padStart(2,'0')}</span>
          <span style="color:#fff;font-size:13px;font-weight:500;min-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${a.user}</span>
          <div style="flex:1;height:5px;background:rgba(255,255,255,.03);border-radius:3px;overflow:hidden">
            <div style="height:100%;width:${(a.count/maxCount)*100}%;background:linear-gradient(90deg,${ASSET_META[a.asset].color},${ASSET_META[a.asset].color}80);border-radius:3px"></div>
          </div>
          <span class="tnum" style="font-size:13px;color:rgba(255,255,255,.75);font-weight:600;min-width:26px;text-align:right">${a.count}</span>
          <span style="font-size:11px;color:${biasColor(a.bias)};font-weight:600;min-width:50px">${biasArrow(a.bias)} ${a.asset}</span>
        </div>`).join('')}
    </div>
    <div style="border-top:1px solid var(--border);padding:11px 24px;font-size:11px;color:rgba(255,255,255,.3)">
      Ranked by message count · signals only · ESC to close
    </div>`);
}

function openSignalsModal(){
  openModal(`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.04)">
      <div style="display:flex;align-items:baseline;gap:14px">
        <span style="font-size:20px;font-weight:700;color:#fff">Strongest Signals</span>
        <span style="font-size:12px;color:var(--tv-secondary)">highest confidence · last 24h</span>
      </div>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>
    <div style="padding:20px 24px">
      ${STRONGEST_SIGNALS.map((s,i) => {
        const assetName = s.asset.charAt(0) + s.asset.slice(1).toLowerCase();
        const amColor = ASSET_META[assetName]?.color || '#fff';
        const tg = tagColor(s.type);
        return `
        <div style="padding:12px 0;${i===STRONGEST_SIGNALS.length-1?'':'border-bottom:1px solid var(--divider)'}">
          <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
            <span class="tnum" style="font-size:16px;color:#26A69A;font-weight:700;min-width:46px">${s.conf}%</span>
            <span class="tag" style="background:${tg.bg};color:${tg.fg}">${s.type}</span>
            <span style="width:6px;height:6px;border-radius:50%;background:${amColor}"></span>
            <span style="color:#fff;font-size:13px;font-weight:500">${s.user}</span>
            <div style="flex:1"></div>
            <span class="tnum" style="font-size:10px;color:var(--tv-muted)">${s.time}</span>
          </div>
          <div style="padding-left:56px;font-size:12px;color:rgba(255,255,255,.65);line-height:1.45">${s.preview}</div>
        </div>`;
      }).join('')}
    </div>
    <div style="border-top:1px solid var(--border);padding:11px 24px;font-size:11px;color:rgba(255,255,255,.3)">
      Confidence ≥ 75% threshold · ESC to close
    </div>`);
}

function openMessageModal(idx){
  const msgs = filteredMessages();
  const m = msgs[idx];
  if (!m) return;
  const primaryAsset = m.tags.find(t => ['GOLD','SILVER','OIL'].includes(t));
  const accentColor = primaryAsset
    ? ASSET_META[primaryAsset.charAt(0) + primaryAsset.slice(1).toLowerCase()].color
    : biasColor(m.sentiment);
  const biasCol = biasColor(m.sentiment);
  openModal(`
    <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.04)">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:20px;font-weight:700;color:#fff">${m.user}</span>
        <span style="font-size:12px;color:var(--tv-secondary);font-weight:500">#${m.channel}</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span class="tnum" style="font-size:11px;color:var(--tv-muted)">${m.time}</span>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
    </div>
    <div style="padding:24px">
      <!-- Message body -->
      <div style="background:rgba(255,255,255,.02);border:1px solid var(--divider);border-radius:8px;padding:18px 20px;position:relative;margin-bottom:20px">
        <div style="position:absolute;left:0;top:14px;bottom:14px;width:2px;border-radius:0 2px 2px 0;background:${accentColor};opacity:.8"></div>
        <div style="font-size:14px;color:rgba(255,255,255,.9);line-height:1.55;padding-left:10px">${m.text}</div>
      </div>
      <!-- Classification grid -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px">
        <div style="background:rgba(255,255,255,.02);border:1px solid var(--divider);border-radius:8px;padding:12px 14px">
          <div style="font-size:10px;color:var(--tv-secondary);font-weight:500;letter-spacing:.4px;text-transform:uppercase">Sentiment</div>
          <div style="font-size:16px;color:${biasCol};font-weight:600;margin-top:4px">${biasArrow(m.sentiment)} ${m.sentiment}</div>
        </div>
        <div style="background:rgba(255,255,255,.02);border:1px solid var(--divider);border-radius:8px;padding:12px 14px">
          <div style="font-size:10px;color:var(--tv-secondary);font-weight:500;letter-spacing:.4px;text-transform:uppercase">Confidence</div>
          <div class="tnum" style="font-size:18px;color:#26A69A;font-weight:700;margin-top:4px">${m.conf}%</div>
        </div>
        <div style="background:rgba(255,255,255,.02);border:1px solid var(--divider);border-radius:8px;padding:12px 14px">
          <div style="font-size:10px;color:var(--tv-secondary);font-weight:500;letter-spacing:.4px;text-transform:uppercase">Classified</div>
          <div style="font-size:12px;color:rgba(255,255,255,.7);margin-top:6px">gpt-4o-mini<br/><span style="color:var(--tv-muted)">v2.1</span></div>
        </div>
      </div>
      <!-- Tags -->
      <div>
        <div style="font-size:10px;color:var(--tv-secondary);font-weight:500;letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px">Tags</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${m.tags.map(t => { const tg = tagColor(t); return `<span class="tag" style="background:${tg.bg};color:${tg.fg};padding:4px 10px;font-size:10px">${t}</span>`; }).join('')}
        </div>
      </div>
    </div>
    <div style="border-top:1px solid var(--border);padding:11px 24px;font-size:11px;color:rgba(255,255,255,.3)">
      Raw Discord message · ingested ${m.time} · ESC to close
    </div>`);
}

// ── INIT ────────────────────────────────────────────────────────────
function renderAll(){
  renderStats();
  renderBriefing();
  renderSummaryCards();
  renderLatestCard();
}
renderAssetFilter();
renderAll();
</script>
</body></html>
