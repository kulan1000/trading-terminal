<!doctype html>
<html><head><meta charset="utf-8"/><title>Scoring v1</title>
<style>
  :root {
    --tv-bg:#0a0a0a; --tv-surface:#111; --tv-elevated:#1a1a1a; --tv-sidebar:#060606;
    --tv-text:#D1D4DC; --tv-heading:#fff; --tv-secondary:#787B86; --tv-muted:#434651;
    --tv-bull:#26A69A; --tv-bear:#EF5350; --tv-blue:#2962FF; --tv-orange:#FF9800; --tv-gold:#FFD700;
    --border:rgba(255,255,255,0.06); --border-d:rgba(255,255,255,0.08); --border-h:rgba(255,255,255,0.12);
    --divider:rgba(255,255,255,0.05);
  }
  html,body{margin:0;height:100%;background:var(--tv-bg);
    background-image:radial-gradient(ellipse 80% 60% at 50% 0%, rgba(20,25,40,.35) 0%, transparent 70%);
    color:var(--tv-text);
    font-family:-apple-system,BlinkMacSystemFont,"Trebuchet MS",Roboto,Ubuntu,sans-serif;
    font-feature-settings:"tnum";}
  *{scrollbar-width:thin;scrollbar-color:var(--border-d) transparent;box-sizing:border-box}
  ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:var(--border-d);border-radius:3px}
  @keyframes ping{75%,100%{transform:scale(2);opacity:0}}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @keyframes modal-in{from{opacity:0;transform:scale(.94) translateY(16px)}to{opacity:1;transform:none}}
  @keyframes backdrop-in{from{opacity:0}to{opacity:1}}
  .fade{animation:fade .2s ease both}
  .tnum{font-variant-numeric:tabular-nums}
  .hair{height:1px;width:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.06),transparent)}
  .card{background:var(--tv-surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;
    transition:border-color .2s, background .2s, transform .2s, box-shadow .2s}
  .card.clickable,.card.hoverable{cursor:pointer}
  .card.clickable:hover,.card.hoverable:hover{border-color:var(--border-h);background:#151515;transform:translateY(-1px);
    box-shadow:0 0 30px -10px rgba(255,255,255,.08)}
  .chip{display:inline-flex;align-items:center;padding:3px 7px;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.3px}
  .pulse{position:relative;display:inline-flex;width:8px;height:8px}
  .pulse::before{content:'';position:absolute;inset:0;border-radius:50%;background:var(--tv-bull);opacity:.5;animation:ping 1.5s cubic-bezier(0,0,.2,1) infinite}
  .pulse::after{content:'';position:absolute;inset:0;border-radius:50%;background:var(--tv-bull)}
  .nav-item{position:relative;height:44px;display:flex;align-items:center;justify-content:center;
    margin:3px 8px;border-radius:8px;color:#787B86;cursor:pointer;transition:all .15s}
  .nav-item:hover{color:#D1D4DC;background:rgba(255,255,255,.03)}
  .nav-item.active{color:#2962FF;background:rgba(41,98,255,.08)}
  .nav-item.active::before{content:'';position:absolute;left:-8px;top:50%;transform:translateY(-50%);
    width:3px;height:20px;border-radius:0 3px 3px 0;background:#2962FF;box-shadow:0 0 8px rgba(41,98,255,.6)}
  .nav-item svg{width:17px;height:17px;transition:filter .15s}
  .nav-item.active svg{filter:drop-shadow(0 0 6px rgba(41,98,255,.55))}
  .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);
    z-index:9998;animation:backdrop-in .25s ease both;display:flex;align-items:center;justify-content:center;padding:16px}
  .modal{position:relative;z-index:9999;width:95vw;max-width:960px;max-height:90vh;overflow-y:auto;
    background:var(--tv-surface);border:1px solid var(--border);border-radius:12px;
    box-shadow:0 20px 70px rgba(0,0,0,.6);animation:modal-in .35s cubic-bezier(.16,1,.3,1) both}
  .close-btn{display:flex;width:28px;height:28px;align-items:center;justify-content:center;
    border-radius:6px;color:var(--tv-muted);cursor:pointer;transition:all .15s;background:transparent;border:none;font-size:14px}
  .close-btn:hover{background:rgba(255,255,255,.06);color:var(--tv-text)}
  /* Scoring specific */
  .asset-pill{display:inline-flex;align-items:center;padding:6px 14px;border-radius:6px;font-size:11px;
    font-weight:600;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;transition:all .15s;
    background:rgba(255,255,255,.03);color:rgba(255,255,255,.4);border:1px solid transparent}
  .asset-pill:hover{color:rgba(255,255,255,.75)}
  .asset-pill.active{background:rgba(255,152,0,.12);color:#FF9800;border-color:rgba(255,152,0,.25);
    box-shadow:0 0 16px -4px rgba(255,152,0,.35)}
  .tab{padding:10px 18px;font-size:12px;font-weight:500;color:var(--tv-secondary);cursor:pointer;
    border-bottom:2px solid transparent;transition:all .15s;margin-bottom:-1px}
  .tab:hover{color:rgba(255,255,255,.7)}
  .tab.active{color:#fff;border-bottom-color:#2962FF}
  .row-click{cursor:pointer;transition:background .15s}
  .row-click:hover{background:rgba(255,255,255,.025)}
</style>
</head><body>
<div style="display:flex;height:100vh">
  <!-- sidebar -->
  <aside style="width:56px;background:var(--tv-sidebar);border-right:1px solid var(--border-d);
    background-image:linear-gradient(180deg,rgba(20,25,40,.15),transparent 40%);display:flex;flex-direction:column">
    <div style="height:56px;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--border-d)">
      <div style="width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,#2962FF,rgba(41,98,255,.4));
        box-shadow:0 0 16px -2px rgba(41,98,255,.55);display:flex;align-items:center;justify-content:center;
        font-size:11px;font-weight:800;color:#fff;letter-spacing:-.3px">TT</div>
    </div>
    <nav style="flex:1;padding:6px 0" id="nav"></nav>

      <span class="pulse"></span>
    </div>
  </aside>

  <!-- main -->
  <main style="flex:1;overflow-y:auto;padding:20px 24px">
    <!-- Header -->
    <div class="fade" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:12px">
        <h1 style="margin:0;font-size:15px;font-weight:600;letter-spacing:.3px;color:#fff">
          Trader Scoring
        </h1>
        <span class="pulse"></span>
        <span style="font-size:11px;color:var(--tv-secondary)">Scored over 30m · 1h · 2h · 4h horizons</span>
      </div>
      <div style="display:flex;gap:4px" id="asset-filter"></div>
    </div>

    <!-- 4 stat cards -->
    <div class="fade" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px" id="stats"></div>

    <!-- Podium (top 3 as cards) -->
    <div class="fade" style="margin-bottom:20px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding:0 2px">
        <h2 style="margin:0;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:rgba(255,255,255,.55)">
          Top Performers
        </h2>
        <span style="font-size:10px;color:var(--tv-secondary)">ranked by weighted score · 7d</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px" id="podium"></div>
    </div>

    <!-- Leaderboard (main) + Recent Activity (right) -->
    <div class="fade" style="display:grid;grid-template-columns:1fr 380px;gap:14px;margin-bottom:20px">
      <!-- Leaderboard -->
      <div class="card">
        <div style="padding:16px 20px 8px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--divider)">
          <span style="font-size:13px;color:#fff;font-weight:500">Full Leaderboard</span>
          <span style="font-size:11px;color:var(--tv-secondary)">click any trader for details</span>
        </div>
        <div id="leaderboard"></div>
      </div>

      <!-- Recent Activity -->
      <div class="card">
        <div style="padding:16px 20px 8px;border-bottom:1px solid var(--divider)">
          <span style="font-size:13px;color:#fff;font-weight:500">Recent Scored</span>
        </div>
        <div id="recent" style="max-height:560px;overflow-y:auto"></div>
      </div>
    </div>

    <!-- Tabs: Trade Pairs / Asset Accuracy / GPT Reviews -->
    <div class="fade card" style="margin-bottom:20px">
      <div style="display:flex;padding:0 16px;border-bottom:1px solid var(--divider)">
        <div class="tab active" data-tab="pairs">Trade Pairs <span class="tnum" style="color:var(--tv-muted);margin-left:4px">12</span></div>
        <div class="tab" data-tab="accuracy">Asset Accuracy</div>
        <div class="tab" data-tab="reviews">GPT Reviews <span class="chip" style="background:rgba(255,152,0,.15);color:#FF9800;margin-left:6px">3 new</span></div>
      </div>
      <div id="tab-body"></div>
    </div>

    <!-- Market status -->
    <div class="fade card">
      <div class="hair"></div>
      <div style="display:flex;align-items:center;gap:12px;padding:12px 20px">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#26A69A;animation:ping 2s infinite"></span>
        <span style="font-size:13px;font-weight:500;color:rgba(255,255,255,.8)">Scoring engine active</span>
        <span style="font-size:12px;color:rgba(255,255,255,.3)">next batch in 8m</span>
      </div>
    </div>
  </main>
</div>

<div id="modal-root"></div>

<script>

// ── ASSET FILTER ─────────────────────────────────────────────────────
const ASSETS = ['All','Gold','Silver','Oil'];
let currentAsset = 'All';

// ── DATA ─────────────────────────────────────────────────────────────

// ── HELPERS ──────────────────────────────────────────────────────────
const color = (v) => v > 0 ? '#26A69A' : v < 0 ? '#EF5350' : '#787B86';
const sign = (v) => v > 0 ? '+' : '';
const winColor = (pct) => pct >= 65 ? '#26A69A' : pct >= 50 ? '#FF9800' : '#EF5350';

function sparkline(values, w=80, h=24, col='#26A69A'){
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const pts = values.map((v,i) => `${(i/(values.length-1)*w).toFixed(1)},${(h - ((v-min)/range)*(h-2) - 1).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="flex-shrink:0">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`;
}

// ── FILTER ───────────────────────────────────────────────────────────
function filterTraders(){
  if (currentAsset === 'All') return TRADERS;
  return TRADERS.filter(t => t.assets.includes(currentAsset));
}
function filterRecent(){
  if (currentAsset === 'All') return RECENT;
  return RECENT.filter(r => r.asset.toLowerCase() === currentAsset.toLowerCase());
}

// ── STAT CARDS ───────────────────────────────────────────────────────
function renderStats(){
  const traders = filterTraders();
  const recent = filterRecent();
  const totalScored = traders.reduce((s,t) => s+t.signals, 0);
  const avgWin = traders.length ? (traders.reduce((s,t) => s+t.winRate, 0) / traders.length).toFixed(0) : 0;
  const totalPnl = PAIRS.reduce((s,p) => s+p.pnl, 0);

  const items = [
    {label:'Active Traders', value: traders.length, sub: `of ${TRADERS.length} total`, color:'#fff'},
    {label:'Signals Scored', value: totalScored, sub:`last 7 days`, color:'#fff'},
    {label:'Avg Win Rate',   value: `${avgWin}%`, sub: Number(avgWin) >= 60 ? 'above benchmark' : Number(avgWin) >= 50 ? 'near benchmark' : 'below benchmark', color: winColor(Number(avgWin))},
    {label:'Total P&L',      value: `${sign(totalPnl)}${totalPnl.toFixed(1)}`, sub:`${PAIRS.filter(p=>p.pnl>0).length}W / ${PAIRS.filter(p=>p.pnl<0).length}L`, color: color(totalPnl)},
  ];

  document.getElementById('stats').innerHTML = items.map(it => `
    <div class="card hoverable" style="padding:16px 18px">
      <div style="font-size:11px;color:var(--tv-secondary);font-weight:500">${it.label}</div>
      <div class="tnum" style="font-size:26px;font-weight:700;color:${it.color};letter-spacing:-.5px;margin-top:4px">${it.value}</div>
      <div style="font-size:11px;color:var(--tv-muted);margin-top:2px">${it.sub}</div>
    </div>`).join('');
}

// ── PODIUM ───────────────────────────────────────────────────────────
function renderPodium(){

// ── TRADER MODAL ─────────────────────────────────────────────────────
function openTraderModal(name){
  const t = TRADERS.find(x => x.name === name);
  if (!t) return;
  const recent = RECENT.filter(r => r.trader === name);

  // trend chart
  const W=780, H=120;
  const max = Math.max(...t.trend);
  const pts = t.trend.map((v,i) => `${(i/(t.trend.length-1)*W).toFixed(1)},${(H - (v/max)*(H-20) - 10).toFixed(1)}`).join(' ');
  const fill = `M0,${H} L${pts} L${W},${H} Z`;
  const c = color(t.avgScore);

  const horizonBar = (h) => {
    const c2 = color(h);
    return `<div style="flex:1;text-align:center">
      <div style="font-size:9px;color:var(--tv-muted);letter-spacing:.3px">${h.label}</div>
      <div class="tnum" style="font-size:14px;color:${c2};font-weight:600;margin-top:3px">${sign(h.val)}${h.val.toFixed(2)}%</div>
    </div>`;
  };
  // mock horizon averages
  const horizons = [
    {label:'30m', val: t.avgScore*0.5},
    {label:'1h',  val: t.avgScore*0.8},
    {label:'2h',  val: t.avgScore*1.0},
    {label:'4h',  val: t.avgScore*1.2},
  ];

  const html = `
    <div class="backdrop" id="backdrop">
      <div class="modal" onclick="event.stopPropagation()">
        <!-- HEADER -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid rgba(255,255,255,.04)">
          <div style="display:flex;align-items:baseline;gap:16px">
            <span style="font-size:13px;color:var(--tv-muted)">Trader Profile</span>
            <span style="font-size:24px;font-weight:700;color:#fff">@${t.name}</span>
            <span style="font-size:13px;font-weight:600;color:${c}">
              ${sign(t.avgScore)}${t.avgScore.toFixed(2)}% avg
            </span>
          </div>
          <div style="display:flex;align-items:center;gap:14px">
            <span class="chip tnum" style="background:${winColor(t.winRate)}1f;color:${winColor(t.winRate)}">${t.winRate}% WIN</span>
            <button class="close-btn" onclick="closeModal()">✕</button>
          </div>
        </div>

        <!-- BODY -->
        <div style="padding:20px 24px">
          <!-- Performance chart -->
          <div style="margin-bottom:14px">
            <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">
              <span style="font-size:11px;color:var(--tv-secondary);font-weight:500">Score trend · last 9 signals</span>
              <span style="font-size:10px;color:var(--tv-muted)">trades: ${t.assets.join(' · ')}</span>
            </div>
            <svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="none">
              <defs>
                <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0%" stop-color="${c}" stop-opacity=".22"/>
                  <stop offset="100%" stop-color="${c}" stop-opacity=".02"/>
                </linearGradient>
              </defs>
              <path d="${fill}" fill="url(#tg)"/>
              <polyline points="${pts}" fill="none" stroke="${c}" stroke-width="1.8"/>
            </svg>
          </div>

          <!-- Horizon averages -->
          <div style="display:flex;gap:12px;padding:14px 0;border-top:1px solid var(--divider);border-bottom:1px solid var(--divider);margin-bottom:18px">
            <div style="display:flex;flex-direction:column;justify-content:center;min-width:120px">
              <div style="font-size:10px;color:var(--tv-secondary);font-weight:500">Avg score by horizon</div>
              <div style="font-size:10px;color:var(--tv-muted);margin-top:2px">how fast signals move</div>
            </div>
            ${horizons.map(horizonBar).join('')}
          </div>

          <!-- Stats grid -->
          <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px">
            ${[
              ['Signals', t.signals, '#fff'],
              ['Entries', t.entries, '#fff'],
              ['Exits', t.exits, '#fff'],
              ['Consistency', `${t.consistency}/${t.signals}`, '#26A69A'],
            ].map(([k,v,col]) => `
              <div style="padding:10px 14px;background:rgba(255,255,255,.02);border:1px solid var(--divider);border-radius:8px">
                <div style="font-size:10px;color:var(--tv-secondary);font-weight:500">${k}</div>
                <div class="tnum" style="font-size:18px;color:${col};font-weight:600;margin-top:2px">${v}</div>
              </div>`).join('')}
          </div>

          <!-- Recent signals -->
          <div>
            <div style="font-size:11px;color:var(--tv-secondary);font-weight:500;margin-bottom:4px">Recent signals (${recent.length})</div>
            ${recent.length ? recent.map(r => {
              const KIND_BG = {ENTRY:'rgba(38,166,154,.12)', EXIT:'rgba(255,152,0,.12)'};
              const KIND_FG = {ENTRY:'#26A69A', EXIT:'#FF9800'};
              return `
              <div style="display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--divider)">
                <span class="tnum" style="font-size:10px;color:var(--tv-muted);min-width:40px;padding-top:2px">${r.t}</span>
                <span class="chip" style="background:${KIND_BG[r.kind]};color:${KIND_FG[r.kind]};align-self:flex-start">${r.kind}</span>
                <span style="font-size:10px;color:var(--tv-secondary);font-weight:500;align-self:flex-start;padding-top:4px;min-width:50px">${r.asset}</span>
                <div style="flex:1;min-width:0">
                  <div style="font-size:12px;color:#fff;line-height:1.4">${r.msg}</div>
                </div>
                <span class="tnum" style="font-size:13px;color:${color(r.score)};font-weight:600;align-self:flex-start;padding-top:1px">${sign(r.score)}${r.score.toFixed(2)}%</span>
              </div>`;
            }).join('') : `<div style="font-size:12px;color:var(--tv-muted);padding:14px 0">No recent signals under current filter.</div>`}
          </div>
        </div>

        <div style="border-top:1px solid var(--border);padding:11px 24px;font-size:11px;color:rgba(255,255,255,.3)">
          Scored over 30m · 1h · 2h · 4h windows · ESC to close
        </div>
      </div>
    </div>`;
  const root = document.getElementById('modal-root');
  root.innerHTML = html;
  document.getElementById('backdrop').addEventListener('click', closeModal);
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  document.getElementById('modal-root').innerHTML = '';
  document.body.style.overflow = '';
}
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

// ── INIT ─────────────────────────────────────────────────────────────
function renderAll(){
  renderStats();
  renderPodium();
  renderLeaderboard();
  renderRecent();
  renderTabBody();
}
renderAssetFilter();
renderAll();
